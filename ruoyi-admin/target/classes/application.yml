server:
  port: 8080

spring:
  application:
    name: ruoyi-rbac
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  type-aliases-package: com.ruoyi.system.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456
  expiration: 86400000

ruoyi:
  security:
    tokenHeader: Authorization
    tokenPrefix: "Bearer "

knife4j:
  enable: true
  openapi:
    title: RuoYi RBAC API
    version: 1.0.0
