server:
  port: 8080

spring:
  application:
    name: ruoyi
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  type-aliases-package: com.ruoyi.system.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml

jwt:
  expiration: 86400000

ruoyi:
  security:
    tokenHeader: Authorization
    tokenPrefix: "Bearer "

knife4j:
  enable: true
  openapi:
    title: RuoYi API
    version: 1.0.0
