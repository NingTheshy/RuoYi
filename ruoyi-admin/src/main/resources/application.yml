server:
  port: 8080

spring:
  application:
    name: ruoyi
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ry?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  type-aliases-package: com.ruoyi.system.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough123456
  expiration: 86400000

ruoyi:
  security:
    tokenHeader: Authorization
    tokenPrefix: "Bearer "

knife4j:
  enable: true
  openapi:
    title: RuoYi API
    version: 1.0.0
